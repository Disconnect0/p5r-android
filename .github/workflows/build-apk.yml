name: Build Android APK

on:
  push:
    branches:
      - perf/mali-g57-optimizations
      - perf/android-low-end
      - 'perf/**'
      - 'build/**'
      - main
      - pers
  workflow_dispatch:

jobs:
  build:
    name: Build P5R APK (NCE arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify system dependencies
        run: |
          which ninja cmake zip unzip || (sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cmake zip unzip)

      - name: Install Android NDK 28 and Build Tools 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" \
            "platforms;android-35" \
            "build-tools;35.0.0" > /dev/null
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"

      - name: Fetch Vulkan Headers
        run: |
          git clone --depth 1 --branch v1.4.368 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          mkdir -p /tmp/vulkan-headers/Include
          cp -r /tmp/vulkan-headers/include/* /tmp/vulkan-headers/Include/
          echo "VULKAN_SDK=/tmp/vulkan-headers" >> "$GITHUB_ENV"

      - name: Download Shader Translator (libspirvharness.so)
        run: |
          mkdir -p private/build/spirv_harness_android
          curl -fsSL "https://github.com/Brandon04Gonzalez/p5r-android/releases/download/v0.5.13/p5r.apk" -o /tmp/p5r_v0513.apk
          unzip -p /tmp/p5r_v0513.apk lib/arm64-v8a/libspirvharness.so > private/build/spirv_harness_android/libspirvharness.so
          chmod +x private/build/spirv_harness_android/libspirvharness.so

      - name: Prepare and verify signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.P5R_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.P5R_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.P5R_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.P5R_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: P5R_KEYSTORE_BASE64 secret is missing." >&2
            exit 1
          fi

          mkdir -p "$HOME/.android"
          KEYSTORE_PATH="$HOME/.android/p5r-release.jks"

          # Strip whitespace/newlines so wrapped base64 secrets decode cleanly
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"

          CLEAN_STORE_PASS=$(printf '%s' "${KEYSTORE_PASSWORD:-android}" | tr -d '\r\n')
          CLEAN_ALIAS=$(printf '%s' "${KEY_ALIAS:-androiddebugkey}" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "${KEY_PASSWORD:-$CLEAN_STORE_PASS}" | tr -d '\r\n')

          # Fail fast if the keystore file, password, or alias is invalid
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$CLEAN_STORE_PASS" \
            -alias "$CLEAN_ALIAS" > /dev/null

          {
            echo "P5R_KEYSTORE=$KEYSTORE_PATH"
            echo "P5R_KEYSTORE_PASSWORD=$CLEAN_STORE_PASS"
            echo "P5R_KEY_ALIAS=$CLEAN_ALIAS"
            echo "P5R_KEY_PASSWORD=$CLEAN_KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build P5R APK
        run: |
          chmod +x android/build_apk.sh
          bash android/build_apk.sh --game p5r --nce --release

      - name: Align, Sign, and Prepare APK Output
        id: prep
        run: |
          REF_NAME="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          PERF_TAG=$(sed -n 's/.*kPerfBuildTag = "\([^"]*\)".*/\1/p' games/p5r/game.cpp 2>/dev/null | head -n 1 || true)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')

          if [ -n "${PERF_TAG}" ]; then
            BASE_NAME="p5r-v0.5.12-${PERF_TAG}-${DATE}-${SHORT_SHA}"
          else
            SLUG=$(echo "${REF_NAME}" | sed 's|perf/||; s|fix/||; s|android-||; s|/|-|g')
            BASE_NAME="p5r-v0.5.12-${SLUG}-${DATE}-${SHORT_SHA}"
          fi
          APK_NAME="${BASE_NAME}.apk"

          RAW_APK="private/p5r/apk_nce/p5r.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK=$(find private/p5r/apk_nce -maxdepth 1 -name "*.apk" | head -n 1)
          fi
          if [ -z "${RAW_APK:-}" ] || [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Built APK not found in private/p5r/apk_nce/" >&2
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          # Align first, then sign with apksigner so every build shares the exact same signature
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" "/tmp/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$P5R_KEYSTORE" \
            --ks-pass "env:P5R_KEYSTORE_PASSWORD" \
            --ks-key-alias "$P5R_KEY_ALIAS" \
            --key-pass "env:P5R_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${APK_NAME}" \
            "/tmp/aligned.apk"

          # Verify signature and print certificate SHA-256 digest to confirm consistency
          "$BUILD_TOOLS/apksigner" verify --print-certs "${APK_NAME}"

          ls -lh "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${BASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ steps.prep.outputs.apk_name }}
